[package]
name = "slint-rust-template"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
global-hotkey = "0.8.0"
interprocess = "2.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
single-instance = "0.3.3"
slint = { version = "1.18.1", features = ["unstable-winit-030"] }
url = "2.5.8"
webbrowser = "1.2.4"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
codegen-units = 1
lto = true
